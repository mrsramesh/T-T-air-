version: '3.8'

services:
  # Free local rotating Tor SOCKS5 proxy (Zero Cost, Anonymous IP Rotation)
  tor:
    image: dperson/torproxy:latest
    container_name: cargo_tor_proxy
    restart: unless-stopped
    ports:
      - "9050:9050"
    environment:
      - TOR_ExitNodes={us},{de},{nl},{gb},{ch},{se}
      - TOR_StrictNodes=0
    networks:
      - tracker_net

  # Main Multi-Carrier Cargo Tracker & AutoPilot Daemon
  tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cargo_tracker_app
    restart: unless-stopped
    depends_on:
      - tor
    ports:
      - "8000:8000"
    environment:
      - PROXY_MODE=tor
      - HTTP_PROXY=socks5://tor:9050
      - HTTPS_PROXY=socks5://tor:9050
      - TURKISH_CARGO_PROXY=socks5://tor:9050
    volumes:
      - ./data:/app/data
    networks:
      - tracker_net

networks:
  tracker_net:
    driver: bridge
